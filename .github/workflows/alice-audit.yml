name: Alice integration audit

on:
  push:
    branches: [alice-public-integration-v3.17.3]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:detekt --stacktrace
